<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<title>英語冒險者：日本租屋旅行RPG</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗡️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== HEADER (persistent HUD) ===== -->
  <header id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-avatar" id="hudAvatar">🛡️</div>
      <div class="hud-info">
        <div class="hud-name-row">
          <span id="hudName">勇者</span>
          <span class="hud-level">Lv.<span id="hudLevel">1</span></span>
        </div>
        <div class="bar hp-bar"><div class="bar-fill" id="hudHpFill"></div><span class="bar-label" id="hudHpLabel">HP 0/0</span></div>
        <div class="bar xp-bar"><div class="bar-fill" id="hudXpFill"></div><span class="bar-label" id="hudXpLabel">XP 0/0</span></div>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ===== START / CREATE CHARACTER SCREEN ===== -->
    <section id="screen-start" class="screen">
      <div class="start-card">
        <h1>🏯 英語冒險者</h1>
        <p class="subtitle">日本租屋 × 旅行生活 單字RPG</p>
        <p class="flavor">傳說中，只要集滿足夠的單字之力，就能在日本租到夢想中的房子、順利展開旅程。你，就是被選中的冒險者。</p>

        <label class="field-label" for="nameInput">幫你的角色取名吧</label>
        <input id="nameInput" type="text" maxlength="8" placeholder="例如：小智" autocomplete="off">

        <div class="field-label">選擇職業</div>
        <div id="classGrid" class="class-grid"></div>

        <button id="btnStartGame" class="btn btn-primary btn-big">開始冒險</button>

        <div id="continueWrap" class="hidden">
          <hr class="divider">
          <button id="btnContinue" class="btn btn-secondary btn-big">繼續先前的冒險</button>
          <button id="btnResetAll" class="btn btn-danger">重設所有進度</button>
        </div>
      </div>
    </section>

    <!-- ===== HUB / TOWN SCREEN ===== -->
    <section id="screen-hub" class="screen">
      <div class="hub-card">
        <div class="hub-greeting">歡迎回到<strong>東京租屋鎮</strong>，<span id="hubName"></span>！</div>
        <div class="hub-title-badge" id="hubTitle"></div>
      </div>

      <div class="panel">
        <h2>⚔️ 選擇戰鬥</h2>
        <p class="hint">答對單字題攻擊怪物，答錯會被反擊！先治癒再出發～每次戰鬥都會全血開始。</p>
        <div id="monsterList" class="monster-list"></div>
      </div>

      <div class="panel" id="dexPreviewPanel">
        <h2>📖 本日單字小複習</h2>
        <div id="dexPreview" class="dex-preview"></div>
      </div>
    </section>

    <!-- ===== BATTLE SCREEN ===== -->
    <section id="screen-battle" class="screen">
      <div class="battle-arena">
        <div class="combatant monster-side">
          <div class="combatant-name" id="battleMonsterName">怪物</div>
          <div class="bar hp-bar small"><div class="bar-fill" id="monsterHpFill"></div><span class="bar-label" id="monsterHpLabel">0/0</span></div>
          <div class="sprite monster-sprite" id="monsterSprite">👹</div>
          <div class="floater-zone" id="monsterFloaterZone"></div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="combatant player-side">
          <div class="sprite player-sprite" id="playerSprite">🛡️</div>
          <div class="floater-zone" id="playerFloaterZone"></div>
          <div class="combatant-name" id="battlePlayerName">你</div>
          <div class="bar hp-bar small"><div class="bar-fill" id="playerHpFill"></div><span class="bar-label" id="playerHpLabel">0/0</span></div>
        </div>
      </div>

      <div class="combo-indicator" id="comboIndicator"></div>

      <div class="question-panel">
        <div class="question-type" id="questionType"></div>
        <div class="question-word" id="questionWord">...</div>
        <div id="choiceGrid" class="choice-grid"></div>
      </div>

      <button id="btnFleeBattle" class="btn btn-outline btn-small">🏳️ 逃跑回鎮上</button>
    </section>

    <!-- ===== INVENTORY / BAG SCREEN ===== -->
    <section id="screen-bag" class="screen">
      <h2>🎒 背包與裝備</h2>
      <div class="panel">
        <h3>目前裝備</h3>
        <div id="equippedSlots" class="equip-slots"></div>
      </div>
      <div class="panel">
        <h3>所有道具 (<span id="bagCount">0</span>)</h3>
        <div id="bagGrid" class="bag-grid"></div>
      </div>
    </section>

    <!-- ===== VOCAB DEX SCREEN ===== -->
    <section id="screen-dex" class="screen">
      <h2>📖 單字圖鑑</h2>
      <div class="dex-filter" id="dexFilter"></div>
      <div id="dexList" class="dex-list"></div>
    </section>

    <!-- ===== ACHIEVEMENTS SCREEN ===== -->
    <section id="screen-ach" class="screen">
      <h2>🏆 成就殿堂</h2>
      <p class="hint" id="achProgress"></p>
      <div id="achList" class="ach-list"></div>
    </section>

  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <nav id="bottomNav" class="hidden">
    <button class="nav-btn active" data-screen="hub"><span class="nav-icon">🏠</span><span>城鎮</span></button>
    <button class="nav-btn" data-screen="bag"><span class="nav-icon">🎒</span><span>背包</span></button>
    <button class="nav-btn" data-screen="dex"><span class="nav-icon">📖</span><span>圖鑑</span></button>
    <button class="nav-btn" data-screen="ach"><span class="nav-icon">🏆</span><span>成就</span></button>
    <button class="nav-btn" data-screen="character"><span class="nav-icon">🧙</span><span>角色</span></button>
  </nav>

  <!-- ===== MODALS ===== -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalBox"></div>
  </div>

  <div id="toastZone"></div>

</div>

<script src="app.js"></script>
</body>
</html>
