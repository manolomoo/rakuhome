<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樂房工具</title>
<meta name="description" content="樂房常用網站入口：西班牙文-拳王之路、新聞英文-貴婦養成之路、慈善撲克王大賽、物件景點照片進度表。">
<meta name="theme-color" content="#2f3e4c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="樂房工具">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">
    <header class="head">
      <p class="brand">
        <span class="seal" aria-hidden="true">楽</span>
        <span class="brand-name">樂房ホーム <i>RAKU HOME</i></span>
      </p>
      <h1>我的工具</h1>
      <p class="lead">這四個常用網站都放在這裡，點進去就能用。</p>
    </header>

    <nav class="board" aria-label="工具列表">
      <a class="ticket t-boxing" href="https://manolomoo.github.io/spanish-boxing/">
        <span class="stub"><span>BOXING</span></span>
        <span class="body">
          <span class="no">01</span>
          <span class="name">西班牙文-拳王之路</span>
          <span class="desc">自然語音與回音法，先聽再跟讀</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-news" href="https://manolomoo.github.io/news-english/">
        <span class="stub"><span>NEWS</span></span>
        <span class="body">
          <span class="no">02</span>
          <span class="name">新聞英文-貴婦養成之路</span>
          <span class="desc">每週一個單元，自然語音與回音法</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-poker" href="https://manolomoo.github.io/charity-poker-king/">
        <span class="stub"><span>POKER</span></span>
        <span class="body">
          <span class="no">03</span>
          <span class="name">慈善撲克王大賽</span>
          <span class="desc">進入慈善撲克王大賽</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-spots" href="/spots/">
        <span class="stub"><span>SPOTS</span></span>
        <span class="body">
          <span class="no">04</span>
          <span class="name">物件景點照片進度表</span>
          <span class="desc">拍照進度、稱號與精品收藏</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>
    </nav>

    <p class="tip">想從手機桌面一點就開：用 Safari（iPhone）或 Chrome（Android）打開這一頁，再選<span class="keep">「加入主畫面」</span>。</p>
  </div>
</body>
</html>
