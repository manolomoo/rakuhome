<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>樂房工具</title>
<meta name="description" content="樂房常用網站入口：租屋、景點進度、英文 RPG、單字卡。">
<meta name="theme-color" content="#2f3e4c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="樂房工具">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">
    <header class="head">
      <p class="brand">
        <span class="seal" aria-hidden="true">楽</span>
        <span class="brand-name">樂房ホーム <i>RAKU HOME</i></span>
      </p>
      <h1>我的工具</h1>
      <p class="lead">常用網站都放在這裡，點進去就能用。</p>
    </header>

    <nav class="board" aria-label="工具列表">
      <a class="ticket t-rental" href="/">
        <span class="stub"><span>RENTAL</span></span>
        <span class="body">
          <span class="no">01</span>
          <span class="name">楽房ホーム <em>租屋網站</em></span>
          <span class="desc">台中，給日本人的租屋仲介</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-spots" href="/spots/">
        <span class="stub"><span>SPOTS</span></span>
        <span class="body">
          <span class="no">02</span>
          <span class="name">物件景點進度表 <em>貴婦養成</em></span>
          <span class="desc">拍照進度、稱號與精品收藏</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-rpg" href="/english-rpg/">
        <span class="stub"><span>RPG</span></span>
        <span class="body">
          <span class="no">03</span>
          <span class="name">英文 RPG <em>租屋旅行冒險</em></span>
          <span class="desc">用單字戰鬥，走一趟日本租屋旅程</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>

      <a class="ticket t-cards" href="/flashcards/">
        <span class="stub"><span>CARDS</span></span>
        <span class="body">
          <span class="no">04</span>
          <span class="name">字旅手帳 <em>單字卡</em></span>
          <span class="desc">間隔複習、驗收練習，西／英／日詞庫</span>
        </span>
        <span class="go" aria-hidden="true">進入</span>
      </a>
    </nav>

    <p class="tip">想從手機桌面一點就開：用 Safari（iPhone）或 Chrome（Android）打開這一頁，再選<span class="keep">「加入主畫面」</span>。</p>
  </div>
</body>
</html>
